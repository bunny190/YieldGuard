# YieldGuard default configuration
# All tunables live here so pipelines stay code-free of magic numbers.

project:
  name: "yieldguard"
  seed: 42

paths:
  raw_data: "data/raw/plant_sensor_log.csv"
  processed_dir: "data/processed"
  model_dir: "artifacts/models"
  report_dir: "artifacts/reports"

simulate:
  n_days: 120
  freq_minutes: 5          # sampling interval
  start_date: "2026-01-01"
  base:
    feed_flow: 120.0        # m3/h
    feed_temp: 45.0          # C
    rxn_temp: 180.0          # C
    rxn_press: 8.5            # bar
    cat_activity: 0.95        # 0-1
    hx_dp: 35.0                # kPa
    vib_rms: 2.2                 # mm/s
    feed_comp_upset: 0.0          # 0-1
  noise_std:
    feed_flow: 1.5
    feed_temp: 0.4
    rxn_temp: 0.6
    rxn_press: 0.08
    hx_dp: 1.2
    vib_rms: 0.15
  fault_windows:
    # Each entry injects a fault of given kind over a fraction of the timeline
    - kind: "fouling"
      start_frac: 0.15
      duration_frac: 0.08
      severity: 0.7
    - kind: "catalyst_decay"
      start_frac: 0.35
      duration_frac: 0.12
      severity: 0.6
    - kind: "sensor_drift"
      start_frac: 0.55
      duration_frac: 0.06
      severity: 0.5
    - kind: "feed_upset"
      start_frac: 0.68
      duration_frac: 0.03
      severity: 0.8
    - kind: "stuck_sensor"
      start_frac: 0.85
      duration_frac: 0.04
      severity: 1.0

features:
  lag_steps: [1, 3, 6, 12]        # in samples (5-min sampling -> up to 1h)
  rolling_windows: [6, 12, 36]    # samples -> 30min, 1h, 3h
  rate_of_change_cols:
    - feed_flow
    - rxn_temp
    - rxn_press
    - hx_dp
    - vib_rms

split:
  train_frac: 0.65
  val_frac: 0.15
  test_frac: 0.20   # time-ordered, no shuffling

model:
  regressor:
    type: "gradient_boosting"     # gradient_boosting | random_forest
    n_estimators: 400
    max_depth: 4
    learning_rate: 0.03
    subsample: 0.8
    random_state: 42
  anomaly:
    isolation_forest:
      n_estimators: 300
      contamination: 0.08
      random_state: 42
    spc:
      ewma_alpha: 0.2
      sigma_limit: 3.0
  risk_score:
    residual_weight: 0.5
    isolation_weight: 0.5
